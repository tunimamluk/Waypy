plugins {
	// Minecraft 26.x is unobfuscated: the non-remapping Loom plugin is used and there is no `mappings` line.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

// Dev-only screenshot harness (src/devtest). Never part of the release jar: the `jar`/`sourcesJar`
// tasks only package `main`. Run it with `./gradlew runDevtest` or `scripts/devtest-screenshots.sh`.
sourceSets {
	devtest {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
}

loom {
	mods {
		"waypy" {
			sourceSet sourceSets.main
		}
		"waypy-devtest" {
			sourceSet sourceSets.devtest
		}
	}

	runs {
		devtest {
			client()
			name = "Devtest Client"
			source sourceSets.devtest
			runDir = "run-devtest"
			ideConfigGenerated = false
			// The world is created by the devtest mod if it does not exist yet (quick play then falls back
			// to an error screen that the harness replaces with world creation).
			programArgs "--quickPlaySingleplayer", "waypy-devtest", "--username", "WaypyDev", "--width", "1280", "--height", "720", "--graphicsBackend", "opengl"
			vmArgs "-Dwaypy.devtest=true"
		}
	}
}

// Seed run-devtest/options.txt (small render distance, no onboarding, no pause on focus loss) before each run.
def devtestRunDir = layout.projectDirectory.dir("run-devtest")
def devtestOptions = layout.projectDirectory.file("src/devtest/options.txt")
tasks.register("prepareDevtestRun", Copy) {
	from devtestOptions
	into devtestRunDir
}
tasks.matching { it.name == "runDevtest" }.configureEach {
	dependsOn "prepareDevtestRun"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
